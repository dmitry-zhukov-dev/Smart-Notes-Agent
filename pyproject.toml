
[project]
name = "smart-notes-agent"
version = "0.1.0"
description = "Educational CLI AI agent for managing Markdown notes"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_notes"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
