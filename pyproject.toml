
[project]
name = "smart-notes-agent"
version = "0.1.0"
description = "Educational CLI AI agent for managing Markdown notes"
requires-python = ">=3.14"
dependencies = [
    "langchain-google-genai>=4.4.2",
    "langchain[mcp]>=1.4.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.16.1",
    "langfuse>=3.8.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_notes"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
